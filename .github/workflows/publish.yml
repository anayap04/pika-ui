name: Build & Publish to NPM

# Push/PR quality checks live in ci.yml. This workflow is the release path:
# it re-runs the full gate on a version tag, then publishes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test, Lint & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    
    # Permissions for checking out code and uploading artifacts
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests + a11y (sa11y) + coverage (85% threshold enforced)
        run: npm run test:coverage

      - name: Build library
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish:
    name: Publish to NPM
    needs: test-and-build
    runs-on: ubuntu-latest
    # Only publish on version tags (v0.1.1, v1.0.0, etc.)
    if: startsWith(github.ref, 'refs/tags/v')
    
    # Permissions for publishing to NPM and creating GitHub releases
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false
      
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build library
        run: npm run build
      
      - name: Publish to NPM with provenance
        run: npm publish --provenance --access public
      
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "Release $GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
