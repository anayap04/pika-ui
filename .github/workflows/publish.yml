name: Build & Publish to NPM

# Push/PR quality checks live in ci.yml. This workflow is the release path:
# it re-runs the full gate on a version tag, then publishes.
on:
  push:
    tags:
      - 'v*'

jobs:
  test-and-build:
    name: Test, Lint & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    
    # Permissions for checking out code and uploading artifacts
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests + a11y (sa11y) + coverage (85% threshold enforced)
        run: npm run test:coverage

      - name: Build library
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish:
    name: Publish to NPM
    needs: test-and-build
    runs-on: ubuntu-latest
    # Only publish on version tags (v0.1.0, v1.0.0, etc.)
    if: startsWith(github.ref, 'refs/tags/v')
    
    # Permissions for publishing to NPM and creating GitHub releases
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build library
        run: npm run build
      
      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Create GitHub Release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            # Pika UI ${{ github.ref_name }}
            
            Published to NPM: https://www.npmjs.com/package/@anayap10/pika-ui/v/${{ github.ref_name }}
            
            ## Install
            
            ```bash
            npm install @anayap10/pika-ui@${{ github.ref_name }}
            ```
            
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) or [commit log](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for details.
          draft: false
          prerelease: false
